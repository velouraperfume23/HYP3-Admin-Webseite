<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="glassA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="liquidA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d090" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f0d090" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f0d090" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0d090" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="420" fill="#0b1412"/>
  <circle cx="150" cy="160" r="150" fill="url(#glowA)"/>
  <!-- ground shadow -->
  <ellipse cx="150" cy="392" rx="70" ry="10" fill="#000" opacity="0.35"/>

  <!-- bottle body: tapered trapezoid -->
  <path d="M112 150 L188 150 L204 380 Q204 388 196 388 H104 Q96 388 96 380 Z"
        fill="url(#glassA)" stroke="#eafff6" stroke-opacity="0.25" stroke-width="1.4"/>
  <!-- liquid fill -->
  <path d="M116 220 L184 220 L198 380 Q198 384 193 384 H107 Q102 384 102 380 Z"
        fill="url(#liquidA)"/>
  <!-- measurement tick marks -->
  <g stroke="#eafff6" stroke-opacity="0.3" stroke-width="1">
    <line x1="104" y1="230" x2="112" y2="230"/>
    <line x1="103" y1="255" x2="111" y2="255"/>
    <line x1="102" y1="280" x2="110" y2="280"/>
    <line x1="101" y1="305" x2="109" y2="305"/>
    <line x1="100" y1="330" x2="108" y2="330"/>
  </g>
  <!-- shine -->
  <path d="M120 160 L128 160 L112 380 L106 380 Z" fill="#ffffff" opacity="0.07"/>

  <!-- neck -->
  <rect x="138" y="118" width="24" height="34" fill="url(#glassA)" stroke="#eafff6" stroke-opacity="0.2" stroke-width="1"/>

  <!-- ribbed cap -->
  <rect x="122" y="78" width="56" height="42" rx="4" fill="#f2f4f5" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2">
    <line x1="128" y1="82" x2="128" y2="116"/>
    <line x1="136" y1="82" x2="136" y2="116"/>
    <line x1="144" y1="82" x2="144" y2="116"/>
    <line x1="152" y1="82" x2="152" y2="116"/>
    <line x1="160" y1="82" x2="160" y2="116"/>
    <line x1="168" y1="82" x2="168" y2="116"/>
  </g>
  <!-- spray head -->
  <rect x="136" y="52" width="28" height="28" rx="5" fill="#f2f4f5" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="150" cy="60" r="3" fill="#ffffff" fill-opacity="0.6"/>

  <!-- label plate -->
  <rect x="112" y="270" width="76" height="42" rx="3" fill="#05080a" fill-opacity="0.55" stroke="#f0d090" stroke-opacity="0.5" stroke-width="1"/>
  <text x="150" y="288" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#eafff6" text-anchor="middle" letter-spacing="2">HYP3</text>
  <text x="150" y="302" font-family="Arial, sans-serif" font-size="7.5" fill="#85a89f" text-anchor="middle" letter-spacing="1">SUGAR</text>
</svg>