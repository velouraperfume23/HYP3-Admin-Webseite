<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="glassB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="liquidB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a3a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3a2a3a" stop-opacity="0.72"/>
    </linearGradient>
    <radialGradient id="glowB" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3a2a3a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3a2a3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="420" fill="#0b1412"/>
  <circle cx="150" cy="160" r="150" fill="url(#glowB)"/>
  <ellipse cx="150" cy="392" rx="74" ry="10" fill="#000" opacity="0.35"/>

  <!-- rectangular body -->
  <rect x="98" y="150" width="104" height="232" rx="6"
        fill="url(#glassB)" stroke="#eafff6" stroke-opacity="0.25" stroke-width="1.4"/>
  <!-- liquid fill -->
  <rect x="104" y="220" width="92" height="156" rx="3" fill="url(#liquidB)"/>
  <!-- inner stem line, echoes the visible dip-tube in the reference photo -->
  <path d="M150 176 C 132 230, 168 300, 150 372" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <!-- shine -->
  <rect x="108" y="160" width="10" height="212" fill="#ffffff" opacity="0.06"/>

  <!-- tapered shoulder -->
  <path d="M98 150 L202 150 L176 118 L124 118 Z" fill="url(#glassB)" stroke="#eafff6" stroke-opacity="0.2" stroke-width="1"/>

  <!-- neck -->
  <rect x="136" y="96" width="28" height="24" fill="url(#glassB)" stroke="#eafff6" stroke-opacity="0.2" stroke-width="1"/>

  <!-- ribbed collar -->
  <rect x="122" y="70" width="56" height="28" rx="4" fill="#8fd6f2" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2">
    <line x1="128" y1="74" x2="128" y2="94"/>
    <line x1="136" y1="74" x2="136" y2="94"/>
    <line x1="144" y1="74" x2="144" y2="94"/>
    <line x1="152" y1="74" x2="152" y2="94"/>
    <line x1="160" y1="74" x2="160" y2="94"/>
    <line x1="168" y1="74" x2="168" y2="94"/>
  </g>

  <!-- pump stem -->
  <rect x="141" y="46" width="18" height="26" rx="3" fill="#8fd6f2" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <!-- actuator button -->
  <rect x="128" y="30" width="44" height="20" rx="8" fill="#8fd6f2" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="150" cy="40" r="2.6" fill="#ffffff" fill-opacity="0.7"/>

  <!-- label plate -->
  <rect x="112" y="280" width="76" height="42" rx="3" fill="#05080a" fill-opacity="0.55" stroke="#3a2a3a" stroke-opacity="0.5" stroke-width="1"/>
  <text x="150" y="298" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#eafff6" text-anchor="middle" letter-spacing="2">HYP3</text>
  <text x="150" y="312" font-family="Arial, sans-serif" font-size="7.5" fill="#85a89f" text-anchor="middle" letter-spacing="1">XYRON</text>
</svg>